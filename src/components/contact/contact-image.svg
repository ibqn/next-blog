      <path style="fill:#B7D2E5;" d="M1050,150 L1055,160 L1065,160 L1057,168 L1060,178 L1050,172 L1040,178 L1043,168 L1035,160 L1045,160 Z"/>
      <path style="fill:#9ABFDB;" d="M80,600 L85,610 L95,610 L87,618 L90,628 L80,622 L70,628 L73,618 L65,610 L75,610 Z"/>
      <path style="fill:#F27792;" d="M320,150 L325,160 L335,160 L327,168 L330,178 L320,172 L310,178 L313,168 L305,160 L315,160 Z"/>
      <path style="fill:#78DBBE;" d="M1100,550 L1105,560 L1115,560 L1107,568 L1110,578 L1100,572 L1090,578 L1093,568 L1085,560 L1095,560 Z"/>
      <path style="fill:#5A95BD;" d="M350,720 L355,730 L365,730 L357,738 L360,748 L350,742 L340,748 L343,738 L335,730 L345,730 Z"/>
