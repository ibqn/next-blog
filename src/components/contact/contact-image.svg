      <rect style="fill:#9ABFDB;" x="1022" y="660" width="8" height="30" rx="2"/>
      <rect style="fill:#9ABFDB;" x="1034" y="650" width="8" height="40" rx="2"/>
      <rect style="fill:#9ABFDB;" x="1046" y="640" width="8" height="50" rx="2"/>
