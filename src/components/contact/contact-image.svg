      <circle style="fill:#FFFFFF;" cx="180" cy="725" r="6"/>
      <circle style="fill:#FFFFFF;" cx="210" cy="725" r="6"/>
      <circle style="fill:#FFFFFF;" cx="240" cy="725" r="6"/>
      <rect style="fill:#FFFFFF;" x="170" y="745" width="80" height="5" rx="2"/>
